<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fcdf3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nilton Park</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/karate.css">
  <link rel="stylesheet" href="/voice.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Tela de login -->
  <section id="login">
    <div class="login-card">
      <h1 class="logo" aria-label="Nilton Park">
        <span>N</span><span>I</span><span>L</span><span>T</span><span>O</span><span>N</span>
        <br>
        <span>P</span><span>A</span><span>R</span><span>K</span>
      </h1>
      <p class="tagline">a praça mais tosca da internet</p>
      <div class="login-body">
        <canvas id="preview" width="160" height="170" title="Clique para dar tchau"></canvas>
        <form id="login-form" autocomplete="off" onsubmit="return false">
          <label for="nick">Seu nick</label>
          <input id="nick" maxlength="16" placeholder="ex: Nilton" required autofocus>
          <label>Gorro</label>
          <div class="swatches" id="swatches-hat"></div>
          <label>Casaco</label>
          <div class="swatches" id="swatches-shirt"></div>
          <label>Pele</label>
          <div class="swatches" id="swatches-skin"></div>
          <button id="login-btn" type="submit">Entrar na praça!</button>
          <p id="login-error" role="alert"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- HUD do jogo -->
  <div id="hud" hidden>
    <div class="top-left">
      <button id="online-btn" class="pill">🟢 Online: <b id="online-count">0</b></button>
      <ul id="online-list"></ul>
    </div>
    <div class="top-right">
      <div id="score" class="pill" title="Placar do futebol"></div>
      <button id="mute-btn" class="pill" title="Som"></button>
    </div>
    <div id="zone-toast"></div>
    <div id="banner"></div>
    <div id="toast"></div>

    <ul id="chat-log"></ul>

    <div class="bottom">
      <div id="emotes"></div>
      <form id="chat-form" autocomplete="off" onsubmit="return false">
        <input id="chat-input" placeholder="Fale algo... (Enter)  •  /dance /wave /fart" aria-label="Mensagem">
        <button type="submit">Falar</button>
      </form>
      <p class="help">Clique para andar • WASD/setas • clique em fonte, bancos, postes, lago, patos e bola • 1–5 emotes • clique num player para voz 🎙️ (M = mudo)</p>
    </div>
    <div id="tooltip" hidden></div>

    <!-- Desafios / Gol a Gol -->
    <div id="player-card" hidden></div>
    <div id="invites"></div>
    <div id="gg-bar" hidden></div>
    <div id="gg-help" hidden></div>
    <div id="gg-result" hidden></div>
  </div>

  <div id="disconnected" hidden>
    <div class="login-card small">
      <h2>Caiu a conexão 😵</h2>
      <p>O servidor sumiu ou a internet tropeçou.</p>
      <button id="reconnect-btn">Reconectar</button>
    </div>
  </div>

  <script>
    // Rede instável (troca Wi-Fi/4G = ERR_NETWORK_CHANGED): se um script do jogo falhar ao
    // carregar, ou o jogo não iniciar em 25 s, recarrega sozinho (no máximo 6 vezes seguidas).
    (function () {
      var KEY = 'np.bootTries';
      var tries = 0;
      try { tries = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) { /* sem storage */ }
      var done = false;
      function retry() {
        if (done || window.__npBoot || tries >= 6) return;
        done = true;
        try { sessionStorage.setItem(KEY, String(tries + 1)); } catch (e) { /* sem storage */ }
        setTimeout(function () { location.reload(); }, 1500);
      }
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        var url = t && (t.src || t.href);
        // só arquivos do próprio jogo (fonte do Google fora do ar não conta)
        if (url && url.indexOf(location.origin) === 0 && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) retry();
      }, true);
      setTimeout(function () { if (!window.__npBoot) retry(); }, 25000);
    })();
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
