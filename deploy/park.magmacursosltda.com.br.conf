# Nilton Park no nginx do HOST (termina o TLS) — mais um site, sem mexer nos outros.
# Instalado pelo scripts/setup-domain.sh (sites-available + symlink + nginx -t + certbot --nginx).
# O certbot acrescenta o `listen 443 ssl` e o redirecionamento do 80.
#
# HTTPS é obrigatório para o microfone do chat de voz (getUserMedia só funciona em contexto seguro).
# O container do jogo escuta na porta 3000 (compose.yml); o WebSocket do jogo é /ws.

server {
    server_name park.magmacursosltda.com.br;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket (/ws): o jogo inteiro passa por ele
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # o jogo lê o IP real daqui (limite de conexões por IP) — só confia vindo do proxy local
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # conexão longa: o servidor do jogo manda ping a cada 10 s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
